name: Push CI (E-SOL fork)

# Fork-only push CI. Mirrors the upstream PR pipeline (Ubuntu + Windows
# build/test, clang-format, YAPF, cmakelint) so that every push to the
# fork gets coverage the upstream PR jobs would give us. Python /
# Jimple-Java / CHERI / CUDA regression tests are excluded (not in the
# fork owner's scope of work); macOS-arm + Codecov are skipped because
# both either only test Python or require an upstream-only secret.
#
# clang-format and YAPF fixes are auto-committed back to the pushed
# branch by GITHUB_TOKEN. GitHub's loop protection prevents that
# commit from re-triggering this workflow.

on:
  push:
    branches: [master, solidity]

# Skip irrelevant suites: Python (python/, python-intensive/,
# python-coverage/, mopsa/, numpy/, humaneval/, quixbugs/,
# ai-generated-code/), Jimple (jimple/), CHERI (cheri-c/, cheri-128/,
# cheri-cpp/), CUDA (cuda/*). Substring regex; ctest -LE matches
# against each label string individually.
env:
  E_SOL_EXCLUDE_LABELS: '(python|mopsa|numpy|humaneval|quixbugs|ai-generated|jimple|cheri|cuda)'

jobs:
  build-ubuntu:
    uses: ./.github/workflows/build-unix.yml
    name: static llvm-21 DebugOpt
    with:
      operating-system: ubuntu-24.04
      build-flags: '-b DebugOpt -e ON'
      testing: true
      exclude-labels: '(python|mopsa|numpy|humaneval|quixbugs|ai-generated|jimple|cheri|cuda)'
      run-python-pre-check: false

  build-windows:
    uses: ./.github/workflows/build-windows.yml
    name: static llvm-22 DebugOpt
    with:
      operating-system: windows-latest
      build-flags: '-b DebugOpt -e ON'
      testing: true
      exclude-labels: '(python|mopsa|numpy|humaneval|quixbugs|ai-generated|jimple|cheri|cuda)'

  code-style:
    name: Check C/C++ code-style
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install libtinfo-dev
    - name: Download Clang 11
      run: wget https://github.com/llvm/llvm-project/releases/download/llvmorg-11.0.0/clang+llvm-11.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
    - name: Extract Clang 11
      run: tar xf clang+llvm-11.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz && mv clang+llvm-11.0.0-x86_64-linux-gnu-ubuntu-20.04 clang
    - name: Determine diff range
      id: range
      shell: bash
      run: |
        BEFORE="${{ github.event.before }}"
        if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]] \
           || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
        fi
        echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
    - name: Run clang-format on changed files
      shell: bash
      run: |
        mapfile -t files < <(
          git diff --name-only --diff-filter=d "${{ steps.range.outputs.before }}...HEAD" -- src unit |
          grep -E '\.(h|c|cpp|hpp|hh)$' |
          grep -v '^src/ansi-c/cpp/' |
          grep -v '^src/clang-c-frontend/headers/' |
          grep -v '^src/c2goto/library/libm/musl/' || true
        )
        if [ "${#files[@]}" -eq 0 ]; then
          echo "No changed C/C++ files to format."
          exit 0
        fi
        ./clang/bin/clang-format -style=file -i -fallback-style=none "${files[@]}"
    - name: Delete downloaded Clang 11
      run: rm -rf clang*
    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'style(c++): apply clang-format auto-formatting'

  cmake-style:
    name: Check CMake style (cmakelint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install cmakelint
        run: pip install cmakelint
      - name: Run cmakelint
        continue-on-error: true
        shell: bash
        run: |
          # No .cmakelintrc in repo yet — keep non-blocking until the
          # codebase is formally swept. Excludes vendored / generated trees.
          find . -type f \( -name 'CMakeLists.txt' -o -name '*.cmake' \) \
            -not -path './build/*' \
            -not -path './deps/*' \
            -not -path '*/third_party/*' -print0 \
          | xargs -0 -r cmakelint --filter=-linelength,-readability/wonkycase
